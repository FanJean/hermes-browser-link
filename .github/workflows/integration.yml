name: Pinned Hermes integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # 中文注释：Hermes 是独立的固定测试依赖，不依赖维护者个人安装。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: e62a47ab680bf952b26559e540c28bc18571017c
          path: .ci/hermes
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      # 中文注释：云端站点依赖独立锁文件，只用于离线 SQLite/MCP 验收，不使用个人站点凭据。
      - run: npm ci --ignore-scripts --prefix cloud-link/site
      - run: python -m pip install uv==0.11.2
      - name: Prepare integration environment
        run: |
          uv sync --project .ci/hermes --frozen --no-dev --extra web --python 3.14
          uv pip install --python .ci/hermes/.venv/bin/python PyYAML==6.0.3
      - name: Run full offline gate
        run: HERMES_SOURCE="$PWD/.ci/hermes" HERMES_PYTHON="$PWD/.ci/hermes/.venv/bin/python" npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-report
          path: |
            tests/v1.1-verification/latest.json
            tests/v1.1-verification/logs/
          retention-days: 14
