name: Core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # 中文注释：固定 Action 提交，PR 不取得写权限或个人密钥。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm test
        # 中文注释：macOS AF_UNIX 路径最多 103 字节；runner.temp 是工作流拥有的短临时目录。
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run lint
      - run: npm run check:js
      - run: npm run check:docs
      - run: npm run package -- --output out/ci-package
      - name: Verify package hashes
        run: |
          python3 - <<'PY'
          # 中文注释：验证每一个发布文件，不把构建成功等同于完整性通过。
          import hashlib, json
          from pathlib import Path
          root = Path('out/ci-package')
          for name, expected in json.loads((root / 'SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
