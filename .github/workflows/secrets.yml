name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public source
        run: bash scripts/check-public-release.sh
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          # 中文注释：只下载固定官方版本，校验通过后才执行。
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'gitleaks.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['GITLEAKS_SHA256']
          PY
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan checked-out history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact=100 --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: redacted-secret-scan
          path: ${{ runner.temp }}/gitleaks.json
          retention-days: 14
