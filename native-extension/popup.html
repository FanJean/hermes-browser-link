<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes 浏览器连接</title><link rel="stylesheet" href="popup.css"></head>
<body>
<main class="popup">
  <!-- 中文注释：版本从当前扩展 manifest 读取，右上角同时保留连接状态。 -->
  <header class="header"><div class="brand">Hermes <span>浏览器</span></div><div class="header-meta"><span id="version-label" aria-label="扩展版本"></span><span id="connection-label" aria-label="连接状态" aria-live="polite">检查中</span></div></header>
  <section class="connection-card" id="connection-card"><p id="connection-detail" class="detail"></p><button id="connect" type="button" aria-describedby="connection-detail" hidden>连接 Hermes</button></section>
  <!-- 中文注释：连接确认即授予任务页直接访问，不再提供独立权限开关。 -->
  <section class="access-row" aria-labelledby="access-label">
    <div><h2 id="access-label">任务页访问</h2><p id="access-detail" class="detail" aria-live="polite">连接状态待确认。</p><p class="detail">授权仅限任务页，无须逐站或逐项审批。仍保留接管、停止及凭据保护；Cookie 镜像和弹出页接入另行确认。</p></div>
  </section>
  <!-- 中文注释：云端配对确认授予直接访问，仅授权云端创建的任务页。 -->
  <section class="cloud-section" aria-labelledby="cloud-label">
    <div class="cloud-heading"><h2 id="cloud-label">云端连接</h2><span id="cloud-status" class="status-badge" role="status">检查中</span></div>
    <p id="cloud-detail" class="detail">正在读取连接状态…</p>
    <p id="cloud-access-detail" class="detail">确认配对即允许云端直接读取、点击和填写云端任务页，无须逐站或逐项审批。已有个人标签页不授权。</p>
    <button id="cloud-connect" class="cloud-connect" type="button" aria-describedby="cloud-access-detail">云端连接</button>
  </section>
  <dialog id="cloud-dialog" aria-labelledby="cloud-dialog-title">
    <div class="cloud-dialog-heading"><h2 id="cloud-dialog-title">连接到云端</h2><button id="cloud-dialog-close" class="icon-button" type="button" aria-label="关闭连接面板">×</button></div>
    <p id="cloud-dialog-state" class="detail" role="status"></p>
    <div id="cloud-code-panel"><p class="code-label">在网页端输入连接码</p><output id="cloud-code" class="connection-code"></output><p id="cloud-code-expiry" class="detail" role="status"></p><button id="cloud-copy-code" type="button">复制连接码</button></div>
    <button id="cloud-open-web" class="primary" type="button">打开配对网页</button>
    <div class="cloud-manage"><button id="cloud-regenerate" type="button">重新生成连接码</button><button id="cloud-disconnect" class="danger" type="button" hidden>断开云端</button></div>
    <p id="cloud-error" class="detail" role="alert" hidden></p>
  </dialog>
  <!-- 中文注释：只显示当前标签页的任务；接管和停止都保留，页面遮罩共享同一任务状态。 -->
  <section id="page-task" class="page-task" aria-label="当前页面任务" hidden><span id="operation" role="status"></span><div class="page-controls"><button id="takeover" type="button">接管</button><button id="stop-task" class="danger" type="button">停止</button></div></section>
  <!-- 中文注释：模拟鼠标固定启用，Cookie 镜像只在 Hermes 插件页提供；弹窗只保留自动屏蔽开关。 -->
    <section class="access-row" aria-labelledby="filter-label">
      <div><h2 id="filter-label">自动屏蔽网页干扰</h2><p id="filter-help" class="detail">用内置正则自动识别公告和网页指令，屏蔽对应文本块及截图区域，无须配置网站或选择器。保留验证和错误提示。</p><p id="filter-detail" class="detail" aria-live="polite"></p></div>
      <button id="filter-toggle" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="filter-label" aria-describedby="filter-help" disabled><span></span></button>
    </section>
  <p id="error" role="alert" hidden></p>
</main>
<script type="module" src="popup.mjs"></script><script type="module" src="cloud-popup.mjs"></script>
</body></html>
